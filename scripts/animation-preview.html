<!doctype html><html><head><style>body{margin:0;background:#19201d;color:#e9eddc;font:14px sans-serif}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}section{position:relative}span{position:absolute;top:12px;left:12px;z-index:1}canvas{display:block;width:100%;height:400px}</style></head><body><div id="grid"></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {clone} from 'three/addons/utils/SkeletonUtils.js';import {styleSuperhero} from '/src/superhero.js';import {CharacterAnimation} from '/src/character-animation.js';import {createWorld,stepWorld} from '/src/game.js';
const asset=await new GLTFLoader().loadAsync('/assets/human/Superhero.glb');const moments=[['Takeoff',.08],['Rise',.35],['Apex',.7],['Fall',1.18],['Landing',1.47]];
window.poses=[];
for(const running of [false,true])for(const [label,t] of moments){const section=document.createElement('section');section.innerHTML=`<span>${running?'Running':'Standing'} · ${label}</span>`;document.getElementById('grid').appendChild(section);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(280,400);renderer.setPixelRatio(1);section.appendChild(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#29352f');scene.add(new THREE.HemisphereLight('#ffffff','#868870',3));const light=new THREE.DirectionalLight('#ffffff',3);light.position.set(3,5,3);scene.add(light);const grid=new THREE.GridHelper(8,16,'#8c9b80','#485a47');scene.add(grid);const camera=new THREE.PerspectiveCamera(45,280/400,.01,30);camera.position.set(6,2.8,2);camera.lookAt(0,2.2,0);
const model=clone(asset.scene),root=new THREE.Group();model.traverse(o=>{if(o.isMesh)o.frustumCulled=false;});styleSuperhero(model);root.add(model);scene.add(root);model.updateMatrixWorld(true);model.traverse(o=>{if(o.isSkinnedMesh){o.skeleton.update();o.computeBoundingBox();}});const bounds=new THREE.Box3().setFromObject(model);model.scale.multiplyScalar(1.86/bounds.getSize(new THREE.Vector3()).y);const fittedBounds=new THREE.Box3().setFromObject(model),center=fittedBounds.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.position.y-=fittedBounds.min.y;const world=createWorld();world.status='running';const animation=new CharacterAnimation(model,asset.animations,world);animation.reset(world);
for(let i=0;i<90;i++){stepWorld(world,{forward:running},1/120);animation.update(world,{forward:running},1/120);}
for(let i=0;i<Math.round(t*120);i++){stepWorld(world,{forward:running,jump:i===0},1/120);animation.update(world,{forward:running},1/120);}
root.position.y=world.y-animation.state.crouch*.14;root.rotation.set(-animation.state.lean*.18,0,0,'YXZ');renderer.render(scene,camera);window.poses.push({label,running,world,scale:model.scale.toArray(),position:model.position.toArray(),bounds:new THREE.Box3().setFromObject(model),animation:animation.snapshot()});}
window.previewReady=true;
</script></body></html>
